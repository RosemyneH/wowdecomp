# ʕ •ᴥ•ʔ✿ Same paths as brian8544's mod-streamingclient: /Data/*.MPQ and /signaturefile (from patch-3.MPQ via cdn-env.sh) ✿ ʕ •ᴥ•ʔ
log_format ranged '$remote_addr "$request" range="$http_range" status=$status';

server {
    listen 80;
    server_name _;
    access_log /dev/stdout ranged;
    root /srv/cdn;
    autoindex off;
    gzip off;
    sendfile on;
    tcp_nopush on;

    location = /signaturefile {
        default_type application/octet-stream;
        alias /srv/cdn/signaturefile;
    }

    location /Data/ {
        alias /srv/cdn/Data/;
    }

    location / {
        return 404;
    }
}
