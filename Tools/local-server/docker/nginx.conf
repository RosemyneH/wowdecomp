# ʕ •ᴥ•ʔ✿ Same paths as brian8544's mod-streamingclient: /Data/*.MPQ and an empty /signaturefile ✿ ʕ •ᴥ•ʔ
server {
    listen 80;
    server_name _;
    root /srv/cdn;
    autoindex off;
    gzip off;
    sendfile on;
    tcp_nopush on;

    location = /signaturefile {
        default_type application/octet-stream;
        alias /srv/cdn/signaturefile;
    }

    location /Data/ {
        alias /srv/cdn/Data/;
    }

    location / {
        return 404;
    }
}
