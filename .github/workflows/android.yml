name: android-arm64

# ʕ •ᴥ•ʔ✿ Not part of the tested clients. Manual only. ✿ ʕ •ᴥ•ʔ
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.31.6"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: SDL 3.4.16
        run: |
          curl -fsSL -o sdl.tgz https://github.com/libsdl-org/SDL/archive/refs/tags/release-3.4.16.tar.gz
          tar -xzf sdl.tgz
          echo "SDL3_ROOT=$PWD/SDL-release-3.4.16" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"

      - name: Assemble APK
        run: gradle -p android assembleRelease --stacktrace

      - name: Package
        run: cp android/app/build/outputs/apk/release/app-release.apk wowdecomp-android-arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64-wowdecomp
          path: wowdecomp-android-arm64.apk
          if-no-files-found: error
