name: windows-x64

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      BUILD_DIR: build/x64
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake -S . -B $env:BUILD_DIR -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build WowClient
        run: cmake --build $env:BUILD_DIR --target WowClient --parallel

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: windows-x64-WowClient64
          path: bin/Win/WowClient64.exe
          if-no-files-found: error
