name: windows-x64

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build/x64 -G "Visual Studio 17 2022" -A x64

      - name: Build WowClient
        run: cmake --build build/x64 --config Release --target WowClient --parallel

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: windows-x64-WowClient64
          path: bin/Win/WowClient64.exe
          if-no-files-found: error

  build-arm64:
    runs-on: windows-11-arm
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build/arm64 -G "Visual Studio 17 2022" -A ARM64

      - name: Build WowClient
        run: cmake --build build/arm64 --config Release --target WowClient --parallel

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: windows-arm64-WowClient64
          path: bin/Win/WowClient64.exe
          if-no-files-found: error
