name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-x64:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - name: Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build g++ \
            libsdl3-dev libwayland-dev libcurl4-openssl-dev libasound2-dev libvulkan-dev libxvidcore-dev

      - name: Configure
        run: |
          cmake -S . -B build/linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG" \
            -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG"

      - name: Build WowClient
        run: cmake --build build/linux --target WowClient -j"$(nproc)"

      - name: Package
        run: tar czf wowdecomp-linux-x86_64.tar.gz -C bin/Linux WowClient64

      - uses: actions/upload-artifact@v4
        with:
          name: package-linux-x64
          path: wowdecomp-linux-x86_64.tar.gz

  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake -S . -B build/x64 -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build WowClient
        run: cmake --build build/x64 --target WowClient --parallel

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path bin/Win/WowClient64.exe -DestinationPath wowdecomp-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: package-windows-x64
          path: wowdecomp-windows-x64.zip

  publish:
    if: >-
      always() &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') &&
      needs.linux-x64.result == 'success' &&
      needs.windows-x64.result == 'success'
    needs: [linux-x64, windows-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          notes=$(cat <<'EOF' | sed 's/^          //'
          **Experimental build.** Windows x64 and Linux x86_64. Each archive still needs a retail **WoW 3.3.5a (12340)** `Data` folder. Put it beside the client, or start with `-datadir /path/to/client`. `cameraFov` defaults to **100** (90°).

          | Archive | Platform |
          |---------|----------|
          | `wowdecomp-linux-x86_64.tar.gz` | Linux x86_64 |
          | `wowdecomp-windows-x64.zip` | Windows x64 |
          EOF
          )
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --target "$GITHUB_SHA" --notes "$notes"
          else
            gh release delete continuous --yes --cleanup-tag || true
            gh release create continuous dist/* --prerelease --target "$GITHUB_SHA" --title "Latest build" --notes "$notes"
          fi
