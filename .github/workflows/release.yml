name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-x64:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - name: Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build g++ \
            libsdl3-dev libwayland-dev libcurl4-openssl-dev libasound2-dev libvulkan-dev libxvidcore-dev

      - name: Configure
        run: cmake -S . -B build/linux -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build WowClient
        run: cmake --build build/linux --target WowClient -j"$(nproc)"

      - name: Package
        run: tar czf wowdecomp-linux-x86_64.tar.gz -C bin/Linux WowClient64

      - uses: actions/upload-artifact@v4
        with:
          name: package-linux-x64
          path: wowdecomp-linux-x86_64.tar.gz

  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake -S . -B build/x64 -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build WowClient
        run: cmake --build build/x64 --target WowClient --parallel

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path bin/Win/WowClient64.exe -DestinationPath wowdecomp-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: package-windows-x64
          path: wowdecomp-windows-x64.zip

  windows-arm64:
    runs-on: windows-11-arm
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Configure
        run: cmake -S . -B build/arm64 -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build WowClient
        run: cmake --build build/arm64 --target WowClient --parallel

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path bin/Win/WowClient64.exe -DestinationPath wowdecomp-windows-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: package-windows-arm64
          path: wowdecomp-windows-arm64.zip

  android-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.31.6"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: SDL 3.4.16
        run: |
          curl -fsSL -o sdl.tgz https://github.com/libsdl-org/SDL/archive/refs/tags/release-3.4.16.tar.gz
          tar -xzf sdl.tgz
          echo "SDL3_ROOT=$PWD/SDL-release-3.4.16" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"

      - name: Assemble APK
        run: gradle -p android assembleRelease --stacktrace

      - name: Package
        run: cp android/app/build/outputs/apk/release/app-release.apk wowdecomp-android-arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: package-android-arm64
          path: wowdecomp-android-arm64.apk

  publish:
    if: >-
      always() &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') &&
      needs.linux-x64.result == 'success' &&
      needs.windows-x64.result == 'success' &&
      needs.android-arm64.result == 'success'
    needs: [linux-x64, windows-x64, windows-arm64, android-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          notes=$(cat <<'EOF' | sed 's/^          //'
          **Experimental build.** Desktop archives still need a retail **WoW 3.3.5a (12340)** `Data` folder. Put it beside the client, or start with `-datadir /path/to/client`. `cameraFov` defaults to **100** (90°). The Android APK is a native Vulkan app (arm64, API 33+). On first launch it writes a starter `WoW.mfil` into app storage; point `source=` at an HTTP CDN that serves the 3.3.5a archives. That CDN layout is brian8544's, GPL-2.0: https://github.com/brian8544/streamingclient-3.3.5

          The APK is signed with the CI debug key. Gamepad input matches the Linux client. Audio and cinematics are not wired up on Android yet.

          | Archive | Platform |
          |---------|----------|
          | `wowdecomp-linux-x86_64.tar.gz` | Linux x86_64 |
          | `wowdecomp-windows-x64.zip` | Windows x64 |
          | `wowdecomp-windows-arm64.zip` | Windows on ARM (when the ARM job succeeds) |
          | `wowdecomp-android-arm64.apk` | Android arm64, Vulkan |
          EOF
          )
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --target "$GITHUB_SHA" --notes "$notes"
          else
            gh release delete continuous --yes --cleanup-tag || true
            gh release create continuous dist/* --prerelease --target "$GITHUB_SHA" --title "Latest build" --notes "$notes"
          fi
